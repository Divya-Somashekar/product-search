spring:
  application:
    name: catalog-service
  profiles:
    group:
      local: demo
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  # Connection settings come from the environment (SPRING_DATASOURCE_*); nothing secret is here.
  datasource:
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000 # ms
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          # This service owns Postgres and nothing else, so that is all readiness depends on.
          include: readinessState,db
  observations:
    key-values:
      application: ${spring.application.name}

logging:
  structured:
    format:
      console: ecs

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

catalog:
  currency: EUR
  images:
    # No default. CATALOG_IMAGES_BUCKET comes from the deploy overlay's ConfigMap, which Terraform
    # owns the value of; S3Configuration fails startup if it is missing rather than presigning
    # against an empty bucket name.
    bucket: ${CATALOG_IMAGES_BUCKET:}
    # Blank by default so the SDK reads AWS_REGION, which the deploy overlay sets and IRSA
    # supplies on EKS. Only a context with no AWS environment needs this set explicitly.
    region: ${CATALOG_IMAGES_REGION:}
    view-url-ttl: 15m
    upload-url-ttl: 10m
    max-upload-bytes: 5242880
  outbox:
    # Must outlast the gap between an outbox insert and its commit, or a consumer can step past a
    # seq still in flight. See CLAUDE.md.
    visibility-lag: 1s
