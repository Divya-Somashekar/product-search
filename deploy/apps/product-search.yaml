apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: product-search
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "1" }
spec:
  project: default
  source:
    repoURL: "https://github.com/Divya-Somashekar/product-search.git"
    targetRevision: main
    path: deploy/services/product-search/overlays/local
  destination: { server: "https://kubernetes.default.svc", namespace: product-search }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, SkipDryRunOnMissingResource=true]
    retry: { limit: 10, backoff: { duration: 10s, factor: 2, maxDuration: 3m } }
