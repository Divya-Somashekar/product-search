name: release
on:
  push:
    branches: [main]
    paths: ["app/**"]
  workflow_dispatch:
concurrency: { group: release, cancel-in-progress: false }
permissions:
  contents: write     # commit the tag bump
  packages: write     # push to ghcr.io
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "25" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        working-directory: app
        run: ./gradlew check bootJar
      - id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/product-search" >> "$GITHUB_OUTPUT"
          echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Deploy (bump image tag for ArgoCD)
        run: |
          cd deploy/services/product-search/overlays/local
          kustomize edit set image product-search=${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(deploy): product-search ${{ steps.meta.outputs.tag }}"
          git pull --rebase && git push