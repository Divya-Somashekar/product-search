name: ci
on: pull_request
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "25" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: reports, path: app/build/reports }

# The manifest-validation job moved to the deploy repo
# (Divya-Somashekar/deploy, .github/workflows/ci.yaml), which is where the kustomize overlays now
# live and where every service's overlay gets rendered — not just this one.
